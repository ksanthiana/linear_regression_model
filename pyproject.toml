[project]
name = "linear-regression-model"
version = "1.0.0"
description = "NBA Points-Per-Game linear regression model, FastAPI service, and Flutter client"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "joblib>=1.4.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0.0",
    "nbformat>=5.10.0",
    "nbconvert>=7.16.0",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["summative"]
